
name: Build REELRADAR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Capacitor Android project
        run: |
          mkdir android-wrapper
          cd android-wrapper

          npm init -y

          npm install --no-audit --no-fund \
            @capacitor/core@^7 \
            @capacitor/cli@^7 \
            @capacitor/android@^7

          mkdir www

          echo '<!DOCTYPE html><html><head><title>REELRADAR</title></head><body>Loading REELRADAR...</body></html>' > www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.reelradar.app",
            "appName": "REELRADAR",
            "webDir": "www",
            "server": {
              "url": "https://reelradar-ott-app.vercel.app",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REELRADAR-Android-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
